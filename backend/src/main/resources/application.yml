server:
  port: 8080

spring:
  application:
    name: railway-platform
  profiles:
    # 本地默认加载 application-dev.yml；部署时通过 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/railway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  sql:
    init:
      mode: always
      data-locations: classpath:/data.sql

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: railway-producer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

railway:
  jwt:
    # HS256 密钥（至少 32 字节），必须通过环境变量 JWT_SECRET 或 application-dev.yml 提供
    secret: ${JWT_SECRET}
    expire-days: ${JWT_EXPIRE_DAYS:7}
  pay:
    # mock 支付回调签名密钥（模拟微信/支付宝与商户共用的 appKey），必须通过环境变量 PAY_MOCK_SECRET 提供
    mock-secret: ${PAY_MOCK_SECRET}
  order:
    # 未支付订单过期时间（分钟）与超时扫描间隔（毫秒）；测试可调小
    expire-minutes: ${ORDER_EXPIRE_MINUTES:15}
    timeout-scan-seconds: ${TIMEOUT_SCAN_SECONDS:30000}
    # 同一用户下单频率。压测前把 enabled 设为 false，避免限流把请求挡在库存之前。
    rate-limit:
      enabled: ${ORDER_RATE_LIMIT_ENABLED:false}
      window-seconds: ${ORDER_RATE_LIMIT_WINDOW_SECONDS:10}
      max-requests: ${ORDER_RATE_LIMIT_MAX:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info