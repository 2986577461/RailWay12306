server:
  port: 8080

spring:
  application:
    name: nebula-compute-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/railway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
      continue-on-error: false
      data-locations: classpath:/data.sql

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: nebula-compute-producer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

compute:
  jwt:
    secret: ${JWT_SECRET:nebula-compute-dev-secret-key-please-change-2026}
    expire-days: ${JWT_EXPIRE_DAYS:7}
  payment:
    mock-secret: ${PAY_MOCK_SECRET:nebula-mock-pay-secret-2026}
  order:
    expire-minutes: ${ORDER_EXPIRE_MINUTES:15}
    timeout-scan-seconds: ${TIMEOUT_SCAN_SECONDS:15000}
    rate-limit:
      enabled: ${ORDER_RATE_LIMIT_ENABLED:false}
      window-seconds: ${ORDER_RATE_LIMIT_WINDOW_SECONDS:10}
      max-requests: ${ORDER_RATE_LIMIT_MAX:5}
  provision:
    delay-ms: ${PROVISION_DELAY_MS:1200}
    failure-rate: ${PROVISION_FAILURE_RATE:0}
    max-retries: ${PROVISION_MAX_RETRIES:3}
    retry-delay-seconds: ${PROVISION_RETRY_DELAY_SECONDS:5}
    retry-scan-seconds: ${PROVISION_RETRY_SCAN_SECONDS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
